; Proximity Voice Chat Configuration
; Distance is in Unreal Units (1 meter ≈ 52.5 UU)
; Default: 2048 UU ≈ 39 meters (typical medieval communication range)
[AOC.AOCPlayerController]
ProximityChatDistance=2048.0
bEnableProximityChat=true

